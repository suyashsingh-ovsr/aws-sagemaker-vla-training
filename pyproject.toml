[project]
name = "lerobot-so101-bimanual"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["lerobot[feetech,intelrealsense,viz,dataset,smolvla]"]

[tool.uv]
# flash-attn requires NVCC and no build isolation — must be pre-installed before groot sync
no-build-isolation-package = ["flash-attn"]
# pyarrow 24.0.0 has no Linux wheels
constraint-dependencies = ["pyarrow<24.0.0"]
